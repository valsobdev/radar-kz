name: Sauvegarde des relevés

# La requête quotidienne évite aussi la mise en pause du projet Supabase gratuit.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/backup-elements.mjs
      - name: Commit si changement
        run: |
          if [ -n "$(git status --porcelain data/editor-backup.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898579+github-actions[bot]@users.noreply.github.com"
            git add data/editor-backup.json
            git commit -m "chore: sauvegarde quotidienne des relevés"
            git push
          fi
